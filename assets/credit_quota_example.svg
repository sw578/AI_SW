<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="AI credit quota usage example">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f8fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#333842"/>
      <stop offset="1" stop-color="#282c35"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7d85a"/>
      <stop offset="1" stop-color="#d8a100"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="620" fill="url(#bg)"/>
  <text x="40" y="54" font-size="34" font-family="Segoe UI, Arial, sans-serif" fill="#1f2438" font-weight="700">AI Credit Usage Guide</text>

  <rect x="40" y="90" width="350" height="480" rx="20" fill="#1f2229"/>
  <rect x="62" y="130" width="300" height="110" rx="14" fill="#2f333b" stroke="#444a55"/>
  <circle cx="95" cy="186" r="14" fill="url(#coin)" stroke="#b17a00" stroke-width="1.2"/>
  <text x="120" y="193" font-size="48" font-family="Segoe UI, Arial, sans-serif" fill="#d8dce4" font-weight="800">4500</text>
  <text x="75" y="280" font-size="30" font-family="Segoe UI, Arial, sans-serif" fill="#d8dce4">AI Usage</text>
  <text x="262" y="280" font-size="30" font-family="Segoe UI, Arial, sans-serif" fill="#d8dce4" font-weight="700">0 Credit</text>

  <rect x="62" y="500" width="300" height="48" rx="24" fill="#2f333b" stroke="#4b5160"/>
  <circle cx="94" cy="524" r="14" fill="#424a58" stroke="#5d6678"/>
  <text x="120" y="531" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#c8ced9">0% Used</text>

  <rect x="460" y="118" width="770" height="160" rx="18" fill="#ffffff" stroke="#e4a2b4" stroke-width="4"/>
  <text x="492" y="168" font-size="36" font-family="Segoe UI, Arial, sans-serif" fill="#7a0026" font-weight="800">Hard Quota (Max Credit): 4,500</text>
  <text x="492" y="216" font-size="30" font-family="Segoe UI, Arial, sans-serif" fill="#33394a">Per account maximum credit limit for the whole exam</text>

  <rect x="460" y="312" width="770" height="240" rx="18" fill="#ffffff" stroke="#f1be5f" stroke-width="4"/>
  <text x="492" y="364" font-size="36" font-family="Segoe UI, Arial, sans-serif" fill="#7a5500" font-weight="800">Soft Quota: 3,000 (100% usage reference)</text>
  <text x="492" y="412" font-size="30" font-family="Segoe UI, Arial, sans-serif" fill="#33394a">You can continue up to Hard Quota 4,500.</text>
  <text x="492" y="458" font-size="30" font-family="Segoe UI, Arial, sans-serif" fill="#33394a">Over Hard Quota: AI disabled, popup shown, container auto-close in 5 min.</text>
  <text x="492" y="504" font-size="30" font-family="Segoe UI, Arial, sans-serif" fill="#33394a">Submission is possible before container termination.</text>
</svg>
