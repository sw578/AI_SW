<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비디오 미리보기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f9f5f6;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      color: #1a1a2e;
    }
    .wrap {
      width: min(92vw, 760px);
      text-align: center;
      padding: 24px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(22px, 4vw, 36px);
      color: #A50034;
      font-weight: 800;
    }
    video {
      width: 100%;
      max-width: 760px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(165, 0, 52, 0.18);
      border: 1px solid rgba(165, 0, 52, 0.15);
      background: #000;
      cursor: pointer;
    }
    .note {
      margin-top: 10px;
      color: #5a5a7a;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>먼저 경험하는 AI SW 역량인증시험, 파일럿 참여자 모집중! ✨</h1>

    <video controls autoplay muted loop playsinline preload="auto" onclick="window.location.href='https://sw578.github.io/AI_SW/?v=pilot-root-20260701'" title="클릭하면 파일럿 안내 페이지로 이동합니다.">
      <source src="./promo_video.mp4" type="video/mp4" />
      브라우저가 video 태그를 지원하지 않습니다.
    </video>

    <div class="note">동영상을 클릭하면 파일럿 안내 페이지로 이동합니다.</div>
  </main>
</body>
</html>
